<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Mingguan - Pengeluaran</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body {
      background: linear-gradient(180deg,#131728 0%,#081026 100%);
      color: #e9eef5;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      min-height:100vh;
      padding:32px 16px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .wrap { width:100%; max-width:760px; }
    .card-soft {
      background: linear-gradient(135deg,#272c63,#0e1630);
      border-radius:14px;
      padding:20px;
      box-shadow: 0 8px 24px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      margin-bottom:18px;
    }
    .big-number { color:#bff07a; font-weight:700; font-size:1.6rem; }
    .muted { color:#9fb0d6; }
    .btn-main {
      background: linear-gradient(180deg,#5e54c6,#25316a);
      color:#e8ffb0;
      border-radius:12px;
      border:none;
      padding:10px 14px;
    }
    @media(min-width:992px){
      .wrap { max-width:900px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="m-0">Ringkasan Mingguan</h4>
      <a class="btn btn-sm btn-outline-light" href="catatan.html">Buka Catatan</a>
    </div>

    <div class="card-soft">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <div class="muted">Total Pengeluaran Minggu Ini</div>
          <div id="totalNow" class="big-number">Rp 0</div>
        </div>
        <div class="text-end">
          <div class="muted">Sisa dari Dana Mingguan</div>
          <div id="sisaNow" class="big-number text-info">Rp 0</div>
        </div>
      </div>
    </div>

    <div class="card-soft">
      <h6 class="muted mb-3">Grafik 5 Minggu Terakhir</h6>
      <canvas id="chart" height="120"></canvas>
    </div>

    <div class="mt-3">
      <button class="btn-main w-100" onclick="location.href='catatan.html'">Catatan Pengeluaran Mingguan</button>
    </div>
  </div>

  <script>
  /* ------------------
     Helper: week id (ISO-like) -> "YYYY-Www"
     ------------------ */
  function getWeekId(date = new Date()) {
    // ISO week number algorithm
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    // Set to nearest Thursday: current date + 4 - currentDayNumber
    const dayNum = d.getUTCDay() || 7; // Mon=1..Sun=7
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return d.getUTCFullYear() + '-W' + String(weekNo).padStart(2,'0');
  }

  /* ------------------
     Storage keys:
       - 'pengeluaran' -> array of entries (current week)
       - 'weeks' -> array of previous weeks totals (max 4)
       - 'currentWeekId' -> id of the week for 'pengeluaran'
       - 'danaMingguan' -> weekly budget (number)
     ------------------ */

  function loadStateAndRollIfNeeded() {
    const storedWeek = localStorage.getItem('currentWeekId');
    const nowWeek = getWeekId();
    if (storedWeek && storedWeek !== nowWeek) {
      // week changed -> archive previous week's total
      const prevEntries = JSON.parse(localStorage.getItem('pengeluaran')) || [];
      const prevTotal = prevEntries.reduce((s,e)=> s + (Number(e.jumlah)||0), 0);
      const weeks = JSON.parse(localStorage.getItem('weeks')) || [];
      // push previous week summary (label, total)
      weeks.push({
        id: storedWeek,
        label: storedWeek, // you can format label nicer if desired
        total: prevTotal
      });
      // keep only last 4 previous weeks
      while (weeks.length > 4) weeks.shift();
      localStorage.setItem('weeks', JSON.stringify(weeks));
      // reset current week's entries
      localStorage.setItem('pengeluaran', JSON.stringify([]));
      // update currentWeekId to this new week
      localStorage.setItem('currentWeekId', nowWeek);
    } else if (!storedWeek) {
      // first time: set currentWeekId if not present
      localStorage.setItem('currentWeekId', nowWeek);
    }
  }

  function formatRupiah(n){
    return 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
  }

  // Init
  loadStateAndRollIfNeeded();
  const dana = Number(localStorage.getItem('danaMingguan')) || 0;
  const entries = JSON.parse(localStorage.getItem('pengeluaran')) || [];
  const prevWeeks = JSON.parse(localStorage.getItem('weeks')) || [];

  const totalNow = entries.reduce((s,e) => s + (Number(e.jumlah)||0), 0);
  const sisaNow = dana - totalNow;

  document.getElementById('totalNow').textContent = formatRupiah(totalNow);
  document.getElementById('sisaNow').textContent = formatRupiah(sisaNow);

  // Prepare chart: previous weeks (up to 4) + current week as last
  const labels = [];
  const data = [];
  // use prevWeeks (already ordered oldest->newest)
  prevWeeks.forEach(w => { labels.push(w.label); data.push(w.total); });
  // ensure we have at most 4 previous weeks; if less, fine
  // add current week label
  const currentLabel = getWeekId();
  labels.push(currentLabel);
  data.push(totalNow);

  // If we have more than 5 (shouldn't), trim to last 5
  while (labels.length > 5) { labels.shift(); data.shift(); }

  // nicer labels: convert "YYYY-Www" to e.g. "Www\nYYYY" or "TglStart"
  const niceLabels = labels.map(l => {
    if (l.includes('-W')) return l.replace('-', '\n');
    return l;
  });

  const ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: niceLabels,
      datasets: [{
        label: 'Pengeluaran (Rp)',
        data: data,
        backgroundColor: 'rgba(77,163,255,0.6)',
        borderColor: '#4da3ff',
        borderWidth: 1,
      }]
    },
    options: {
      responsive:true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#cfe6ff' }, grid: { color: 'rgba(255,255,255,0.02)' } },
        y: { ticks: { color: '#cfe6ff' }, grid: { color: 'rgba(255,255,255,0.03)' } }
      },
      animation: { duration: 600, easing: 'easeOutCubic' }
    }
  });
  </script>
</body>
</html>
