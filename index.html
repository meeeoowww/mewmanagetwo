<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Mingguan - Pengeluaran</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body {
      background: linear-gradient(180deg,#131728 0%,#081026 100%);
      color: #e9eef5;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      min-height:100vh;
      padding:32px 16px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .wrap { width:100%; max-width:760px; }
    .card-soft {
      background: linear-gradient(135deg,#272c63,#0e1630);
      border-radius:14px;
      padding:20px;
      box-shadow: 0 8px 24px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      margin-bottom:18px;
    }
    .big-number { color:#bff07a; font-weight:700; font-size:1.6rem; }
    .muted { color:#9fb0d6; }
    .btn-main {
      background: linear-gradient(180deg,#5e54c6,#25316a);
      color:#e8ffb0;
      border-radius:12px;
      border:none;
      padding:10px 14px;
    }
    .btn-main:hover {
      background: linear-gradient(180deg,#706af8,#343f9a);
      color:#fff;
    }
    @media(min-width:992px){
      .wrap { max-width:900px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h4 class="mb-3 text-center">Ringkasan Mingguan</h4>

    <div class="card-soft">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div class="mb-2">
          <div class="muted">Total Pengeluaran Minggu Ini</div>
          <div id="totalNow" class="big-number">Rp 0</div>
        </div>
        <div class="text-end">
          <div class="muted">Sisa dari Dana Mingguan</div>
          <div id="sisaNow" class="big-number text-info">Rp 0</div>
        </div>
      </div>
    </div>

    <div class="card-soft">
      <h6 class="muted mb-3">Grafik 5 Minggu Terakhir</h6>
      <canvas id="chart" height="130"></canvas>
    </div>

    <div class="mt-3">
      <button class="btn-main w-100" onclick="location.href='catatan.html'">Catatan Pengeluaran Mingguan</button>
    </div>
  </div>

<script>
// ----------------------
// Helper: Hitung Minggu ISO
// ----------------------
function getWeekId(date = new Date()) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getUTCFullYear() + '-W' + String(weekNo).padStart(2,'0');
}

function formatRupiah(n){
  return 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
}

// ----------------------
// Auto-arsip & reset per minggu (otomatis)
// ----------------------
function autoArchiveIfWeekChanged() {
  const currentWeek = getWeekId();
  const storedWeek = localStorage.getItem('currentWeekId');

  // Jika belum ada data minggu tersimpan, buat baru
  if (!storedWeek) {
    localStorage.setItem('currentWeekId', currentWeek);
    return;
  }

  // Jika minggu berubah, simpan data lama ke arsip otomatis
  if (storedWeek !== currentWeek) {
    const pengeluaran = JSON.parse(localStorage.getItem('pengeluaran')) || [];
    const total = pengeluaran.reduce((s,e)=>s+(Number(e.jumlah)||0),0);
    const weeks = JSON.parse(localStorage.getItem('weeks')) || [];
    weeks.push({ id: storedWeek, total: total });
    while (weeks.length > 4) weeks.shift(); // simpan 4 minggu terakhir
    localStorage.setItem('weeks', JSON.stringify(weeks));

    // reset minggu baru
    localStorage.setItem('pengeluaran', JSON.stringify([]));
    localStorage.setItem('currentWeekId', currentWeek);
  }
}

// Jalankan auto reset tiap kali halaman dibuka
autoArchiveIfWeekChanged();

// ----------------------
// Hitung & tampilkan data minggu ini
// ----------------------
const dana = Number(localStorage.getItem('danaMingguan')) || 0;
const pengeluaran = JSON.parse(localStorage.getItem('pengeluaran')) || [];
const totalNow = pengeluaran.reduce((s,e)=>s+(Number(e.jumlah)||0),0);
const sisaNow = dana - totalNow;

document.getElementById('totalNow').textContent = formatRupiah(totalNow);
document.getElementById('sisaNow').textContent = formatRupiah(sisaNow);

// ----------------------
// Siapkan grafik mingguan
// ----------------------
const weeks = JSON.parse(localStorage.getItem('weeks')) || [];
const labels = weeks.map(w => w.id.split('-W')[1]);
const data = weeks.map(w => w.total);

// Tambahkan minggu sekarang
labels.push('Now');
data.push(totalNow);

// Maksimal 5 minggu terakhir
while (labels.length > 5) { labels.shift(); data.shift(); }

const ctx = document.getElementById('chart').getContext('2d');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: 'Total Pengeluaran (Rp)',
      data: data,
      backgroundColor: 'rgba(77,163,255,0.7)',
      borderColor: '#4da3ff',
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color:'#cfe6ff' }, grid: { color:'rgba(255,255,255,0.05)' } },
      y: { beginAtZero:true, ticks: { color:'#cfe6ff' }, grid:{ color:'rgba(255,255,255,0.05)' } }
    },
    animation: { duration: 600, easing: 'easeOutCubic' }
  }
});
</script>
</body>
</html>
