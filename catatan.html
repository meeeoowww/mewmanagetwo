<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catatan Mingguan - Pengeluaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(180deg,#131728 0%,#081026 100%);
      color: #eef6ff;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 100px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 820px;
      position: relative;
    }

    .card-soft {
      background: linear-gradient(135deg,#22274e,#0d1830);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 12px;
    }

    .btn-main {
      background: linear-gradient(180deg,#5e54c6,#25316a);
      color: #ecffd6;
      border: none;
      border-radius: 10px;
    }

    .muted {
      color: #9fb0d6;
    }

    /* 🔹 Tombol bawah */
    .bottom-bar {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 820px; /* sama dengan .wrap */
      padding: 0 16px;
    }

    .bottom-bar a {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(180deg,#5e54c6,#25316a);
      color: #e8ffb0;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 0;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      text-decoration: none;
      transition: 0.2s;
    }

    .bottom-bar a:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    @media (max-width: 576px) {
      .bottom-bar {
        padding: 0 12px;
        bottom: 12px;
      }
      .bottom-bar a {
        padding: 10px 0;
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="m-0">Catatan Mingguan</h5>
      <div class="muted small"><span id="weekId"></span></div>
    </div>

    <div class="card-soft mb-3">
      <label class="muted">Dana Mingguan</label>
      <div class="input-group mb-2">
        <input id="dana" type="number" class="form-control" placeholder="Masukkan dana minggu ini (Rp)">
        <button class="btn btn-main" onclick="simpanDana()">Simpan</button>
      </div>
      <div class="muted">Total saat ini: <strong id="totalNow">Rp 0</strong></div>
    </div>

    <div class="card-soft mb-3">
      <div class="row g-2">
        <div class="col-12 col-md-7">
          <input id="deskripsi" class="form-control" placeholder="Deskripsi pengeluaran">
        </div>
        <div class="col-6 col-md-3">
          <input id="jumlah" class="form-control" type="number" placeholder="Jumlah (Rp)">
        </div>
        <div class="col-6 col-md-2 d-grid">
          <button class="btn btn-main" onclick="tambah()">Tambah</button>
        </div>
      </div>
    </div>

    <div id="list" class="mb-3"></div>
  </div>

  <div class="bottom-bar">
    <a href="index.html">Kembali ke Dashboard</a>
  </div>

  <script>
    function getWeekId(date = new Date()) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return d.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
    }

    function formatRupiah(n) {
      return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function checkAndArchiveWeek() {
      const storedWeek = localStorage.getItem('currentWeekId');
      const nowWeek = getWeekId();

      if (storedWeek && storedWeek !== nowWeek) {
        const pengeluaran = JSON.parse(localStorage.getItem('pengeluaran')) || [];
        const total = pengeluaran.reduce((s, e) => s + (Number(e.jumlah) || 0), 0);

        const weeks = JSON.parse(localStorage.getItem('weeks')) || [];
        weeks.push({ id: storedWeek, total });
        while (weeks.length > 5) weeks.shift();

        localStorage.setItem('weeks', JSON.stringify(weeks));
        localStorage.setItem('pengeluaran', JSON.stringify([]));
        localStorage.setItem('currentWeekId', nowWeek);
        localStorage.setItem('danaMingguan', 0);
      }

      if (!storedWeek) localStorage.setItem('currentWeekId', nowWeek);
    }

    checkAndArchiveWeek();

    let pengeluaran = JSON.parse(localStorage.getItem('pengeluaran')) || [];
    let dana = Number(localStorage.getItem('danaMingguan')) || 0;
    const weekId = localStorage.getItem('currentWeekId') || getWeekId();
    document.getElementById('weekId').textContent = weekId;
    document.getElementById('dana').value = dana || '';

    function renderList() {
      const listEl = document.getElementById('list');
      if (!pengeluaran.length) {
        listEl.innerHTML = '<div class="card-soft p-3 muted">Belum ada pengeluaran minggu ini.</div>';
      } else {
        listEl.innerHTML = pengeluaran.map((it, i) => `
          <div class="card-soft mb-2 d-flex justify-content-between align-items-center">
            <div>
              <div><strong>${escapeHtml(it.deskripsi)}</strong></div>
              <div class="muted small">${formatRupiah(it.jumlah)}</div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="hapus(${i})">Hapus</button>
          </div>
        `).join('');
      }
      updateTotals();
    }

    function updateTotals() {
      const total = pengeluaran.reduce((s, it) => s + (Number(it.jumlah) || 0), 0);
      document.getElementById('totalNow').textContent = formatRupiah(total);
      localStorage.setItem('pengeluaran', JSON.stringify(pengeluaran));
    }

    function simpanDana() {
      const v = Number(document.getElementById('dana').value) || 0;
      localStorage.setItem('danaMingguan', v);
      alert('Dana mingguan tersimpan.');
    }

    function tambah() {
      const d = document.getElementById('deskripsi').value.trim();
      const j = Number(document.getElementById('jumlah').value);
      if (!d || !j) return alert('Isi deskripsi dan jumlah!');
      pengeluaran.push({ deskripsi: d, jumlah: j });
      document.getElementById('deskripsi').value = '';
      document.getElementById('jumlah').value = '';
      renderList();
    }

    function hapus(i) {
      if (!confirm('Hapus item ini?')) return;
      pengeluaran.splice(i, 1);
      renderList();
    }

    renderList();
  </script>
</body>
</html>
