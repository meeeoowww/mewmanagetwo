<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catatan Mingguan - Pengeluaran</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(180deg, #131728 0%, #081026 100%);
      color: #eef6ff;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 820px;
    }

    .card-soft {
      background: linear-gradient(135deg, #22274e, #0d1830);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.03);
      margin-bottom: 12px;
    }

    .btn-main {
      background: linear-gradient(180deg, #5e54c6, #25316a);
      color: #ecffd6;
      border: none;
      border-radius: 10px;
    }

    .btn-main:hover {
      background: linear-gradient(180deg, #6b60d8, #2d3b7a);
    }

    .muted {
      color: #9fb0d6;
    }

    .danger-sm {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Tombol bawah responsif */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 576px) {
      .action-buttons {
        flex-direction: row;
      }
    }

    /* Warna tombol agar serasi dengan tema */
    .btn-light {
      background: #d6e0ff;
      color: #10142a;
      border: none;
    }
    .btn-light:hover {
      background: #b9c8ff;
    }

    .btn-outline-danger {
      border-color: #ff6b6b;
      color: #ff8686;
    }
    .btn-outline-danger:hover {
      background: #ff6b6b;
      color: white;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a class="btn btn-light btn-sm" href="index.html">⬅ Kembali</a>
      <h5 class="m-0">Catatan Mingguan</h5>
      <div class="muted">Week: <span id="weekId"></span></div>
    </div>

    <!-- Dana Mingguan -->
    <div class="card-soft mb-3">
      <label class="muted">Dana Mingguan</label>
      <div class="input-group mb-2">
        <input id="dana" type="number" class="form-control" placeholder="Masukkan dana minggu ini (Rp)" />
        <button class="btn btn-main" onclick="simpanDana()">Simpan</button>
      </div>
      <div class="muted">Total saat ini: <strong id="totalNow">Rp 0</strong></div>
    </div>

    <!-- Form Pengeluaran -->
    <div class="card-soft mb-3">
      <div class="row g-2">
        <div class="col-12 col-sm-7">
          <input id="deskripsi" class="form-control" placeholder="Deskripsi pengeluaran (mis. makan)" />
        </div>
        <div class="col-6 col-sm-3">
          <input id="jumlah" class="form-control" type="number" placeholder="Jumlah (Rp)" />
        </div>
        <div class="col-6 col-sm-2 d-grid">
          <button class="btn btn-main" onclick="tambah()">Tambah</button>
        </div>
      </div>
    </div>

    <!-- Daftar Pengeluaran -->
    <div id="list" class="mb-3"></div>

    <!-- Tombol Aksi -->
    <div class="action-buttons mt-3">
      <button class="btn btn-outline-danger flex-fill" onclick="resetWeekConfirmed()">Reset Minggu (kosongkan)</button>
      <button class="btn btn-light flex-fill" onclick="archiveNow()">Archive (simpan total & reset)</button>
    </div>

  </div>

  <script>
    // ==== Fungsi Penentu Minggu ====
    function getWeekId(date = new Date()) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return d.getUTCFullYear() + '-W' + String(weekNo).padStart(2, '0');
    }

    function formatRupiah(n) {
      return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
    }

    // ==== Cek & Pindahkan Data Minggu Lama ====
    function loadAndRollIfNeeded() {
      const storedWeek = localStorage.getItem('currentWeekId');
      const nowWeek = getWeekId();
      if (storedWeek && storedWeek !== nowWeek) {
        const prevEntries = JSON.parse(localStorage.getItem('pengeluaran')) || [];
        const prevTotal = prevEntries.reduce((s, e) => s + (Number(e.jumlah) || 0), 0);
        const weeks = JSON.parse(localStorage.getItem('weeks')) || [];
        weeks.push({ id: storedWeek, label: storedWeek, total: prevTotal });
        while (weeks.length > 4) weeks.shift();
        localStorage.setItem('weeks', JSON.stringify(weeks));
        localStorage.setItem('pengeluaran', JSON.stringify([]));
        localStorage.setItem('currentWeekId', nowWeek);
      } else if (!storedWeek) {
        localStorage.setItem('currentWeekId', nowWeek);
      }
    }

    loadAndRollIfNeeded();

    // ==== Inisialisasi Data ====
    let pengeluaran = JSON.parse(localStorage.getItem('pengeluaran')) || [];
    let dana = Number(localStorage.getItem('danaMingguan')) || 0;
    const weekId = localStorage.getItem('currentWeekId') || getWeekId();
    document.getElementById('weekId').textContent = weekId;
    document.getElementById('dana').value = dana || '';

    // ==== Render List ====
    function renderList() {
      const listEl = document.getElementById('list');
      if (!pengeluaran.length) {
        listEl.innerHTML = '<div class="card-soft p-3 muted text-center">Belum ada pengeluaran minggu ini.</div>';
      } else {
        let html = '';
        pengeluaran.forEach((it, idx) => {
          html += `
            <div class="card-soft mb-2 d-flex justify-content-between align-items-center flex-wrap">
              <div>
                <div><strong>${escapeHtml(it.deskripsi)}</strong></div>
                <div class="muted small">Rp ${Number(it.jumlah).toLocaleString('id-ID')}</div>
              </div>
              <button class="btn btn-sm btn-danger danger-sm mt-2 mt-sm-0" onclick="hapus(${idx})">Hapus</button>
            </div>`;
        });
        listEl.innerHTML = html;
      }
      updateTotals();
    }

    function updateTotals() {
      const total = pengeluaran.reduce((s, it) => s + (Number(it.jumlah) || 0), 0);
      document.getElementById('totalNow').textContent = formatRupiah(total);
      localStorage.setItem('pengeluaran', JSON.stringify(pengeluaran));
    }

    // ==== Fungsi Interaktif ====
    function simpanDana() {
      const v = Number(document.getElementById('dana').value) || 0;
      dana = v;
      localStorage.setItem('danaMingguan', dana);
      alert('Dana mingguan tersimpan.');
      updateTotals();
    }

    function tambah() {
      const d = document.getElementById('deskripsi').value.trim();
      const j = Number(document.getElementById('jumlah').value);
      if (!d || !j) return alert('Isi deskripsi dan jumlah!');
      pengeluaran.push({ deskripsi: d, jumlah: j, createdAt: new Date().toISOString() });
      document.getElementById('deskripsi').value = '';
      document.getElementById('jumlah').value = '';
      renderList();
    }

    function hapus(i) {
      if (!confirm('Hapus item ini?')) return;
      pengeluaran.splice(i, 1);
      renderList();
    }

    // ==== Archive & Reset ====
    function archiveNow() {
      const currentWeek = localStorage.getItem('currentWeekId') || getWeekId();
      const total = pengeluaran.reduce((s, it) => s + (Number(it.jumlah) || 0), 0);
      const weeks = JSON.parse(localStorage.getItem('weeks')) || [];
      weeks.push({ id: currentWeek, label: currentWeek, total: total });
      while (weeks.length > 4) weeks.shift();
      localStorage.setItem('weeks', JSON.stringify(weeks));
      localStorage.setItem('pengeluaran', JSON.stringify([]));
      pengeluaran = [];
      const newWeek = getWeekId(new Date(Date.now() + 7 * 24 * 3600 * 1000));
      localStorage.setItem('currentWeekId', newWeek);
      alert('Minggu ini diarsipkan dan data direset.');
      document.getElementById('weekId').textContent = localStorage.getItem('currentWeekId');
      renderList();
    }

    function resetWeekConfirmed() {
      if (!confirm('Kosongkan semua pengeluaran minggu ini?')) return;
      pengeluaran = [];
      localStorage.setItem('pengeluaran', JSON.stringify([]));
      renderList();
    }

    // ==== Escape HTML untuk keamanan ====
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    renderList();
  </script>
</body>
</html>
